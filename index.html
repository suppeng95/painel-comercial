<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel Comercial — Support Engenharia</title>
<style>

:root{
  --fundo:#F1F5F6; --superficie:#FFFFFF; --superficie2:#F7FAFB;
  --tinta:#0F2C35; --grafite:#67818A; --linha:#DFE8EA;
  --indigo:#0E5A6E; --indigo-fraco:#E6F0F2; --ciano:#3E9DB5; --verde:#7FB123;
  --laranja:#D98C1F; --roxo:#04404F; --vermelho:#CB4436; --cinza-graf:#B4C6CB;
  --lima:#95C11F; --petroleo:#04404F;
  --lateral-fundo:#04404F; --lateral-txt:#BCD6DC; --lateral-linha:#0B5164;
  --r:14px; --r-p:10px;
  --sombra:0 1px 2px rgba(4,64,79,.06), 0 12px 28px -18px rgba(4,64,79,.45);
  --lateral:238px;
}
body.escuro{
  --fundo:#062630; --superficie:#0B313D; --superficie2:#0E3A48;
  --tinta:#DDEAED; --grafite:#7E99A2; --linha:#14424F; --indigo-fraco:#0F3D4A;
  --cinza-graf:#2C4E5A; --indigo:#39A0B8; --ciano:#5FBBD0;
  --sombra:0 1px 2px rgba(0,0,0,.45), 0 14px 32px -20px rgba(0,0,0,.85);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--fundo);color:var(--tinta);
  font-family:"Segoe UI",Roboto,-apple-system,"Helvetica Neue",Arial,sans-serif;
  font-size:14.5px;line-height:1.55;font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
a{color:var(--indigo)}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.01em}

/* ---------------- estrutura ---------------- */
.app{display:grid;grid-template-columns:var(--lateral) minmax(0,1fr);min-height:100vh}
.lateral{background:var(--lateral-fundo);border-right:1px solid var(--lateral-linha);padding:22px 14px;
  position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column;gap:22px}
.logo{padding:2px 10px 0}
.logo img{width:132px;height:auto;display:block}
.logo span{display:block;margin-top:9px;font-size:11px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--lima);font-weight:600}
.nav-rot{font-size:10.5px;letter-spacing:.08em;color:#7FA3AD;padding:0 10px 8px;text-transform:uppercase}
.lateral nav{display:grid;gap:2px}
.lateral nav a{text-decoration:none}
.lateral nav a,
.lateral nav button{appearance:none;width:100%;text-align:left;background:none;border:0;cursor:pointer;
  font:inherit;font-size:14px;font-weight:500;color:var(--lateral-txt);padding:9px 11px;border-radius:var(--r-p);
  display:flex;align-items:center;gap:10px}
.lateral nav a:hover,
.lateral nav button:hover{background:rgba(255,255,255,.08);color:#fff}
.lateral nav a.ativo,
.lateral nav button.ativo{background:var(--lima);color:#06323D;font-weight:650}
.lateral nav button .ic{width:18px;text-align:center;opacity:.9}
.cartao-lateral{margin-top:auto;background:rgba(255,255,255,.07);border:1px solid var(--lateral-linha);
  border-left:3px solid var(--lima);border-radius:var(--r);padding:14px}
.cartao-lateral b{display:block;font-size:13px;margin-bottom:3px;color:#fff}
.cartao-lateral p{margin:0;font-size:12px;color:var(--lateral-txt);line-height:1.45}

.conteudo{min-width:0;display:flex;flex-direction:column}
.topo{position:sticky;top:0;z-index:30;background:var(--superficie);border-bottom:1px solid var(--linha);
  padding:12px 26px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.icone{appearance:none;background:none;border:1px solid var(--linha);border-radius:var(--r-p);
  width:36px;height:36px;font-size:17px;cursor:pointer;color:var(--tinta);display:none}
.busca{flex:1;min-width:180px;display:flex;align-items:center;gap:8px;background:var(--fundo);
  border:1px solid var(--linha);border-radius:var(--r-p);padding:8px 12px;max-width:340px;color:var(--grafite)}
.busca input{border:0;background:none;outline:none;font:inherit;color:var(--tinta);width:100%}
.topo-acoes{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pilula{background:var(--fundo);border:1px solid var(--linha);border-radius:99px;padding:6px 13px;
  font-size:12.5px;color:var(--grafite)}
main{padding:24px 26px 60px;max-width:1360px;width:100%}
.saudacao{margin-bottom:22px}
.saudacao h1{font-size:24px;color:var(--petroleo)}
body.escuro .saudacao h1{color:var(--tinta)}
.saudacao p{margin:6px 0 0;color:var(--grafite);max-width:78ch;font-size:14px}

/* ---------------- botões e campos ---------------- */
.btn{font:inherit;font-size:13.5px;font-weight:550;padding:9px 16px;border-radius:var(--r-p);cursor:pointer;
  border:1px solid var(--petroleo);background:var(--petroleo);color:#fff}
.btn:hover{filter:brightness(1.07)}
.btn.sec{background:var(--superficie);color:var(--tinta);border-color:var(--linha)}
.btn.sec:hover{background:var(--fundo);filter:none}
input,select{font:inherit;font-size:13.5px;padding:8px 11px;border:1px solid var(--linha);
  background:var(--superficie);color:var(--tinta);border-radius:var(--r-p)}
label.campo{display:grid;gap:5px;font-size:11.5px;color:var(--grafite);font-weight:500}
.barra-ctrl{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin:0 0 18px}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--indigo);outline-offset:2px}

/* ---------------- cartões ---------------- */
.cartao{background:var(--superficie);border:1px solid var(--linha);border-radius:var(--r);
  padding:18px 20px;box-shadow:var(--sombra)}
.cartao h2{font-size:16px;color:var(--petroleo)}
body.escuro .cartao h2{color:var(--tinta)}
.cartao .nota,.nota{color:var(--grafite);font-size:13px;margin:4px 0 14px;max-width:76ch}
.grade{display:grid;gap:18px}
.g-2{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr)}
.g-2i{grid-template-columns:minmax(0,1fr) minmax(0,1.3fr)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(206px,1fr));gap:16px}
.kpi{background:var(--superficie);border:1px solid var(--linha);border-top:3px solid var(--lima);border-radius:var(--r);
  padding:15px 18px 10px;box-shadow:var(--sombra);position:relative;overflow:hidden}
.kpi .l{font-size:12.5px;color:var(--grafite)}
.kpi .v{font-size:25px;font-weight:650;margin-top:4px;letter-spacing:-.02em}
.kpi .d{margin-top:6px;display:flex;align-items:center;gap:7px;flex-wrap:wrap;font-size:12px}
.delta{font-weight:600;padding:2px 8px;border-radius:99px;font-size:11.5px}
.delta.up{color:var(--verde);background:rgba(23,178,106,.12)}
.delta.down{color:var(--vermelho);background:rgba(240,68,56,.12)}
.delta-txt{color:var(--grafite)}
svg.spark{display:block;width:100%;height:34px;margin:10px -18px -10px;width:calc(100% + 36px)}

/* ---------------- gráficos ---------------- */
svg.chart{display:block;width:100%;height:auto;overflow:visible}
.barra{fill:var(--indigo)} .barra.parcial{fill:var(--ciano)} .barra:hover{fill:var(--lima)}
.barra.vazia{fill:none;stroke:var(--cinza-graf);stroke-width:1.5;stroke-dasharray:4 3}
.eixo{stroke:var(--linha);stroke-width:1}
.rot-eixo{font-size:11px;fill:var(--grafite)} .rot-valor{font-size:10.5px;fill:var(--grafite)}
.rosca-n{font-size:19px;font-weight:650;fill:var(--tinta)}
.rosca-l{font-size:11px;fill:var(--grafite)}
.legenda{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:9px}
.legenda li{display:flex;align-items:center;gap:9px;font-size:13px}
.ponto{width:9px;height:9px;border-radius:3px;flex:none}
.leg-nome{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.leg-val{color:var(--grafite);font-weight:600}

/* ---------------- tabelas ---------------- */
.rolagem{overflow:auto;max-height:70vh;border:1px solid var(--linha);border-radius:var(--r);
  background:var(--superficie);box-shadow:var(--sombra)}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:13px}
th,td{padding:10px 14px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--linha)}
th{background:var(--superficie2);font-weight:600;color:var(--grafite);font-size:11.5px;
  letter-spacing:.03em;text-transform:uppercase;position:sticky;top:0;z-index:1}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--superficie);z-index:2}
th:first-child{z-index:3;background:var(--superficie2)}
td.txt{text-align:left;white-space:normal;min-width:190px}
tbody tr:hover td{background:var(--indigo-fraco)}
tbody tr:hover td:first-child{background:var(--indigo-fraco)}
tr.total td{font-weight:650;background:var(--superficie2);border-top:1px solid var(--linha)}
tr.total td:first-child{background:var(--superficie2)}
td.zero{color:var(--cinza-graf)}
.tag{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11.5px;font-weight:550;
  background:var(--fundo);color:var(--grafite);border:1px solid var(--linha)}
.tag.f{background:rgba(23,178,106,.12);color:var(--verde);border-color:transparent}
.tag.e{background:rgba(59,166,245,.14);color:var(--ciano);border-color:transparent}
.tag.p{background:rgba(240,68,56,.12);color:var(--vermelho);border-color:transparent}
.tag.v{background:rgba(247,144,9,.14);color:var(--laranja);border-color:transparent}

/* ---------------- ranking ---------------- */
.rank{list-style:none;margin:0;padding:0}
.rank li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:5px 12px;padding:11px 0;
  border-bottom:1px solid var(--linha)}
.rank li:last-child{border-bottom:0}
.rank .nome{font-weight:550;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank .val{font-weight:650}
.rank .trilho{grid-column:1/-1;height:6px;background:var(--fundo);border-radius:99px;overflow:hidden}
.rank .preench{display:block;height:6px;border-radius:99px;
  background:linear-gradient(90deg,var(--petroleo),var(--lima))}
.rank .meta{grid-column:1/-1;font-size:12px;color:var(--grafite)}

/* ---------------- notícias ---------------- */
.noticias{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:18px;align-items:start}
.feed{display:grid;gap:14px}
article.nt{background:var(--superficie);border:1px solid var(--linha);border-radius:var(--r);
  padding:16px 18px;box-shadow:var(--sombra)}
article.nt h3{font-size:15.5px;line-height:1.35;margin-bottom:7px}
article.nt h3 a{color:inherit;text-decoration:none}
article.nt h3 a:hover{color:var(--indigo)}
article.nt p{margin:0 0 11px;color:var(--grafite);font-size:13.5px;max-width:72ch}
article.nt .meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:12px;color:var(--grafite)}
article.nt.cliente{border-left:3px solid var(--lima)}
.lado{display:grid;gap:18px}
.linkedin{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.linkedin li{display:flex;justify-content:space-between;gap:10px;align-items:center;font-size:13.5px;
  padding:8px 10px;border-radius:var(--r-p)}
.linkedin li:hover{background:var(--fundo)}
.linkedin a{font-size:12.5px;text-decoration:none}
.linkedin a:hover{text-decoration:underline}

section.painel{display:none}
section.painel.ativo{display:block}
.avisos{background:var(--superficie);border:1px solid var(--linha);border-left:3px solid var(--lima);
  border-radius:var(--r);padding:16px 20px;margin-top:20px;font-size:13px;box-shadow:var(--sombra)}
.avisos p{margin:0 0 7px;color:var(--grafite)} .avisos p:last-child{margin:0}
.avisos strong{color:var(--tinta)}
.vazio{background:var(--superficie);border:1px dashed var(--linha);border-radius:var(--r);padding:30px 26px}
.vazio p{margin:0;color:var(--grafite)}
footer{margin-top:34px;padding-top:16px;border-top:1px solid var(--linha);color:var(--grafite);font-size:12.5px}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--tinta);
  color:var(--superficie);padding:11px 20px;border-radius:var(--r-p);font-size:13.5px;opacity:0;
  pointer-events:none;transition:opacity .18s;z-index:60}
.toast.ver{opacity:1}

@media (max-width:1080px){.g-2,.g-2i,.noticias{grid-template-columns:1fr}}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .lateral{position:fixed;left:0;top:0;z-index:50;width:var(--lateral);transform:translateX(-100%);
    transition:transform .2s;box-shadow:var(--sombra)}
  body.lateral-aberta .lateral{transform:none}
  .icone{display:block}
  main{padding:20px 16px 50px}
  .topo{padding:12px 16px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---------------- login e estados ---------------- */
.tela-login{min-height:100vh;display:grid;place-items:center;padding:24px;
  background:radial-gradient(circle at 30% 20%, #0A5568 0%, #04404F 55%, #032B36 100%)}
.caixa-login{width:min(400px,100%);background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.14);border-radius:18px;padding:34px 30px;
  backdrop-filter:blur(6px);display:grid;gap:14px}
.caixa-login .login-logo{width:150px;margin:0 auto 4px;display:block}
.caixa-login h1{color:#fff;font-size:20px;text-align:center}
.caixa-login .nota{color:#AECBD3;text-align:center;margin:0 0 6px}
.caixa-login label.campo{color:#AECBD3;font-size:12px}
.caixa-login input{background:rgba(255,255,255,.09);border-color:rgba(255,255,255,.18);color:#fff}
.caixa-login input:focus{outline-color:var(--lima)}
.caixa-login .btn{background:var(--lima);border-color:var(--lima);color:#06323D;
  font-weight:650;padding:11px;font-size:14.5px}
.caixa-login .btn[disabled]{opacity:.6;cursor:progress}
.login-ou{display:flex;align-items:center;gap:10px;color:#7FA3AD;font-size:12px;margin:2px 0}
.login-ou::before,.login-ou::after{content:"";flex:1;height:1px;background:rgba(255,255,255,.15)}
.caixa-login .btn-ms{display:flex;align-items:center;justify-content:center;gap:9px;
  width:100%;background:#fff;border:1px solid #d7dde2;border-radius:6px;color:#1b1f24;
  font:inherit;font-weight:600;font-size:14px;padding:10px 12px;cursor:pointer}
.caixa-login .btn-ms:hover:not([disabled]){background:#f3f5f7}
.caixa-login .btn-ms[disabled]{opacity:.6;cursor:progress}
.caixa-login .btn-ms-ic{display:flex;line-height:0}
.link-simples{background:none;border:0;color:#AECBD3;font:inherit;font-size:13px;
  cursor:pointer;text-decoration:underline;padding:0}
.link-simples:hover{color:#fff}
.msg{margin:0;font-size:13px;padding:9px 12px;border-radius:var(--r-p)}
.msg.erro{background:rgba(203,68,54,.16);color:#FFC9C2}
.msg.ok{background:rgba(149,193,31,.16);color:#DCEFA8}
.carregando{min-height:100vh;display:grid;place-items:center;color:var(--grafite);
  font-size:15px;padding:24px;text-align:center}
.carregando .msg.erro{background:rgba(203,68,54,.12);color:var(--vermelho);max-width:46ch}
.usuario{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--grafite)}
.usuario span{max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
</style>
</head>
